player1.add([
  pos(4, -20),

  color(0, 0, 0)
]);
var player2 = add([
  pos(width() - 40, 0),
  rect(20, 80),
  anchor("center"),
  area({ isSensor: true }),
  "paddle"
]);
player2.add([
  pos(-4, -20),
  rect(2, 6),

]);
player2.add([
  pos(4, -20),
  rect(2, 6),
  color(0, 0, 0)
]);
onUpdate("paddle", (p) => {
  p.moveTo(p.pos.x, mousePos().y);
});
var score = 0;
var speed = 480;
var ball = add([
  pos(center()),
  rect(16, 16),
  area({ isSensor: true, shape: new Rect(vec2(-16), 32, 32) }),
  { vel: Vec2.fromAngle(rand(-20, 20)) }
]);
ball.onUpdate(() => {
  ball.move(ball.vel.scale(speed));
  if (ball.pos.x < 0 || ball.pos.x > width()) {
    score = 0;
    ball.pos = center();
    ball.vel = Vec2.fromAngle(rand(-20, 20));
    speed = 320;
  }
  if (ball.pos.y < 0 || ball.pos.y > height()) {
    ball.vel.y = -ball.vel.y;
  }
});
ball.onCollide("paddle", (p) => {
  speed += 60;
  ball.vel = Vec2.fromAngle(ball.pos.angle(p.pos));
  score++;
});
ball.onCollide("dot", (p) => {
  speed += 10;
  ball.vel = Vec2.fromAngle(ball.pos.angle(p.pos));
  score++;
});
